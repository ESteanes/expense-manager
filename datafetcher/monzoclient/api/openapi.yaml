  securitySchemes:
    MonzoOAuth2:
      description: |
        Monzo uses OAuth 2.0 for authentication. Before you begin, create a client in the developer tools at https://developers.monzo.com.

        Confidential clients receive refresh tokens, while non-confidential clients must re-authenticate when access tokens expire.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.monzo.com/
          refreshUrl: https://api.monzo.com/oauth2/token
          scopes: {}
          tokenUrl: https://api.monzo.com/oauth2/token
      type: oauth2
    BearerAuth:
      bearerFormat: JWT
      description: Direct Bearer token authentication (for manually providing access
        tokens)
      scheme: bearer
      type: http
