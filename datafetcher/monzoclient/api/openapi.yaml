openapi: 3.0.3
info:
  contact:
    url: https://community.monzo.com/c/developers
  description: |
    The Monzo API is designed to be a predictable and intuitive interface for interacting with users' accounts.
    We offer both a REST API and webhooks.

    The API implements OAuth 2.0 for authentication and provides access to accounts, transactions, pots, and more.
  termsOfService: https://monzo.com/legal/terms-and-conditions/
  title: Monzo API
  version: 1.0.0
servers:
- description: Production API server
  url: https://api.monzo.com
- description: OAuth authorization server
  url: https://auth.monzo.com
security:
- MonzoOAuth2: []
tags:
- description: OAuth 2.0 authentication endpoints
  name: Authentication
- description: Account management operations
  name: Accounts
- description: Account balance operations
  name: Balance
- description: Savings pots management
  name: Pots
- description: Transaction operations
  name: Transactions
- description: Feed item management
  name: Feed Items
- description: Transaction attachment operations
  name: Attachments
- description: Transaction receipt operations
  name: Receipts
- description: Webhook management
  name: Webhooks
paths:
  /oauth2/token:
    post:
      description: |
        Exchange an authorization code for an access token, or use a refresh token to get a new access token.
      operationId: exchangeToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/exchangeToken_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Successfully exchanged token
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      security: []
      summary: Exchange authorization code or refresh token
      tags:
      - Authentication
  /oauth2/logout:
    post:
      description: Invalidates the current access token immediately.
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Successfully logged out
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Log out and invalidate access token
      tags:
      - Authentication
  /ping/whoami:
    get:
      description: Returns information about the currently authenticated user and
        client.
      operationId: whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
          description: Token information retrieved successfully
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Get information about access token
      tags:
      - Authentication
  /accounts:
    get:
      description: Returns a list of accounts owned by the currently authorised user.
      operationId: listAccounts
      parameters:
      - description: Filter by account type
        explode: true
        in: query
        name: account_type
        required: false
        schema:
          enum:
          - uk_retail
          - uk_retail_joint
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
          description: List of accounts retrieved successfully
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: List accounts
      tags:
      - Accounts
  /balance:
    get:
      description: Returns balance information for a specific account.
      operationId: getBalance
      parameters:
      - description: The id of the account
        explode: true
        in: query
        name: account_id
        required: true
        schema:
          example: acc_00009237aqC8c5umZmrRdh
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
          description: Balance retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Read balance
      tags:
      - Balance
  /pots:
    get:
      description: Returns a list of pots owned by the currently authorised user that
        are associated with the specified account.
      operationId: listPots
      parameters:
      - description: The account id to retrieve pots for
        explode: true
        in: query
        name: current_account_id
        required: true
        schema:
          example: acc_00009237aqC8c5umZmrRdh
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PotsResponse"
          description: List of pots retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: List pots
      tags:
      - Pots
  /pots/{pot_id}/deposit:
    put:
      description: Move money from an account into a pot.
      operationId: depositIntoPot
      parameters:
      - description: The id of the pot
        explode: false
        in: path
        name: pot_id
        required: true
        schema:
          example: pot_0000778xxfgh4iu8z83nWb
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/depositIntoPot_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pot"
          description: Deposit successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Deposit into a pot
      tags:
      - Pots
  /pots/{pot_id}/withdraw:
    put:
      description: Move money from a pot into an account.
      operationId: withdrawFromPot
      parameters:
      - description: The id of the pot
        explode: false
        in: path
        name: pot_id
        required: true
        schema:
          example: pot_0000778xxfgh4iu8z83nWb
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/withdrawFromPot_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pot"
          description: Withdrawal successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Withdraw from a pot
      tags:
      - Pots
  /transactions:
    get:
      description: Returns a list of transactions on the user's account.
      operationId: listTransactions
      parameters:
      - description: The account to retrieve transactions from
        explode: true
        in: query
        name: account_id
        required: true
        schema:
          example: acc_00009237aqC8c5umZmrRdh
          type: string
        style: form
      - description: Start time as RFC3339 encoded timestamp or object id
        explode: true
        in: query
        name: since
        required: false
        schema:
          example: 2009-11-10T23:00:00Z
          type: string
        style: form
      - description: End time as RFC3339 encoded timestamp
        explode: true
        in: query
        name: before
        required: false
        schema:
          example: 2009-11-10T23:00:00Z
          type: string
        style: form
      - description: Limits the number of results per-page
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Expand merchant inline
        explode: true
        in: query
        name: "expand[]"
        required: false
        schema:
          enum:
          - merchant
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
          description: List of transactions retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: List transactions
      tags:
      - Transactions
  /transactions/{transaction_id}:
    get:
      description: "Returns an individual transaction, fetched by its id."
      operationId: getTransaction
      parameters:
      - description: The id of the transaction
        explode: false
        in: path
        name: transaction_id
        required: true
        schema:
          example: tx_00008zIcpb1TB4yeIFXMzx
          type: string
        style: simple
      - description: Expand merchant inline
        explode: true
        in: query
        name: "expand[]"
        required: false
        schema:
          enum:
          - merchant
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getTransaction_200_response"
          description: Transaction retrieved successfully
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found - The endpoint or resource requested does not exist
      summary: Retrieve transaction
      tags:
      - Transactions
    patch:
      description: Store key-value annotations against a transaction in its metadata.
      operationId: annotateTransaction
      parameters:
      - description: The id of the transaction
        explode: false
        in: path
        name: transaction_id
        required: true
        schema:
          example: tx_00008zIcpb1TB4yeIFXMzx
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties:
                type: string
              description: "Metadata key-value pairs. Use metadata[key]=value format.\
                \ Set value to empty string to delete a key."
              example:
                metadata[foo]: bar
                metadata[notes]: My custom note
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getTransaction_200_response"
          description: Transaction annotated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found - The endpoint or resource requested does not exist
      summary: Annotate transaction
      tags:
      - Transactions
  /feed:
    post:
      description: Creates a new feed item on the user's feed.
      operationId: createFeedItem
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FeedItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Feed item created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Create feed item
      tags:
      - Feed Items
  /attachment/upload:
    post:
      description: Obtain a temporary URL to upload an attachment file.
      operationId: uploadAttachment
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/uploadAttachment_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadResponse"
          description: Upload URL generated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Upload attachment
      tags:
      - Attachments
  /attachment/register:
    post:
      description: Register an attachment URL against a transaction.
      operationId: registerAttachment
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/registerAttachment_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerAttachment_200_response"
          description: Attachment registered successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Register attachment
      tags:
      - Attachments
  /attachment/deregister:
    post:
      description: Remove an attachment from a transaction.
      operationId: deregisterAttachment
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/deregisterAttachment_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Attachment deregistered successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Deregister attachment
      tags:
      - Attachments
  /transaction-receipts:
    delete:
      description: Delete a receipt based on its external ID.
      operationId: deleteReceipt
      parameters:
      - description: The external ID of the receipt
        explode: true
        in: query
        name: external_id
        required: true
        schema:
          example: test-receipt-1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Receipt deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found - The endpoint or resource requested does not exist
      summary: Delete receipt
      tags:
      - Receipts
    get:
      description: Read back a receipt that you've created based on its external ID.
      operationId: getReceipt
      parameters:
      - description: The external ID of the receipt
        explode: true
        in: query
        name: external_id
        required: true
        schema:
          example: test-receipt-1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getReceipt_200_response"
          description: Receipt retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found - The endpoint or resource requested does not exist
      summary: Retrieve receipt
      tags:
      - Receipts
    put:
      description: Attach a receipt to a transaction with line-item purchase data.
      operationId: createReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Receipt"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createReceipt_200_response"
          description: Receipt created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Create receipt
      tags:
      - Receipts
  /webhooks:
    get:
      description: List the webhooks registered on an account.
      operationId: listWebhooks
      parameters:
      - description: The account to list registered webhooks for
        explode: true
        in: query
        name: account_id
        required: true
        schema:
          example: acc_00009237aqC8c5umZmrRdh
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhooksResponse"
          description: List of webhooks retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: List webhooks
      tags:
      - Webhooks
    post:
      description: Register a webhook to receive real-time notifications of events
        in an account.
      operationId: registerWebhook
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/registerWebhook_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerWebhook_200_response"
          description: Webhook registered successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request - Your request has missing arguments or is malformed
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
      summary: Register a webhook
      tags:
      - Webhooks
  /webhooks/{webhook_id}:
    delete:
      description: Delete a webhook to stop receiving notifications.
      operationId: deleteWebhook
      parameters:
      - description: The id of the webhook to delete
        explode: false
        in: path
        name: webhook_id
        required: true
        schema:
          example: webhook_000091yhhOmrXQaVZ1Irsv
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Webhook deleted successfully
        "401":
          content:
            application/json:
              example:
                error: invalid_token
                error_description: The supplied access token is invalid or has expired
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized - Your request is not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found - The endpoint or resource requested does not exist
      summary: Delete a webhook
      tags:
      - Webhooks
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Bad Request - Your request has missing arguments or is malformed
    Unauthorized:
      content:
        application/json:
          example:
            error: invalid_token
            error_description: The supplied access token is invalid or has expired
          schema:
            $ref: "#/components/schemas/Error"
      description: Unauthorized - Your request is not authenticated
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Forbidden - Your request is authenticated but has insufficient
        permissions
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Not Found - The endpoint or resource requested does not exist
    MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Method Not Allowed - You are using an incorrect HTTP verb
    NotAcceptable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Not Acceptable - Your application does not accept the content format
        returned
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Too Many Requests - Your application is exceeding its rate limit
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Internal Server Error - Something went wrong on Monzo's end
    GatewayTimeout:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Gateway Timeout - Something has timed out on Monzo's end
  schemas:
    AuthorizationCodeRequest:
      properties:
        grant_type:
          description: Must be set to authorization_code
          enum:
          - authorization_code
          type: string
        client_id:
          description: The client ID you received from Monzo
          type: string
        client_secret:
          description: The client secret which you received from Monzo
          type: string
        redirect_uri:
          description: The URL in your app where users were sent after authorisation
          format: uri
          type: string
        code:
          description: The authorization code received when the user was redirected
            back
          type: string
      required:
      - client_id
      - client_secret
      - code
      - grant_type
      - redirect_uri
      type: object
    RefreshTokenRequest:
      properties:
        grant_type:
